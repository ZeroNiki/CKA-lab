id: arch-03-security-context
title: Hardened Pod security context
difficulty: hard
ns: lab-secctx
statement: |
  In namespace `lab-secctx` create a Pod `secure` (image `busybox:1.36`, command `sleep 3600`):

  Pod level:
  - all containers run as user `1000` and group `3000`,
  - mounted volumes are owned by group `2000`,
  - the Pod must be refused if it would run as root,
  - seccomp profile `RuntimeDefault`.

  Container level:
  - privilege escalation is not allowed,
  - the root filesystem is read-only,
  - **all** Linux capabilities are dropped except `NET_BIND_SERVICE`.
checks:
  - type: resource
    description: Pod-level user 1000, group 3000, fsGroup 2000, runAsNonRoot, RuntimeDefault seccomp
    target: {apiVersion: v1, kind: Pod, name: secure}
    assert:
      - {path: "{.spec.securityContext.runAsUser}", op: eq, value: "1000"}
      - {path: "{.spec.securityContext.runAsGroup}", op: eq, value: "3000"}
      - {path: "{.spec.securityContext.fsGroup}", op: eq, value: "2000"}
      - {path: "{.spec.securityContext.runAsNonRoot}", op: eq, value: "true"}
      - {path: "{.spec.securityContext.seccompProfile.type}", op: eq, value: RuntimeDefault}
  - type: resource
    description: Container has no privilege escalation, read-only root FS, drops ALL and adds NET_BIND_SERVICE
    target: {apiVersion: v1, kind: Pod, name: secure}
    assert:
      - {path: "{.spec.containers[0].securityContext.allowPrivilegeEscalation}", op: eq, value: "false"}
      - {path: "{.spec.containers[0].securityContext.readOnlyRootFilesystem}", op: eq, value: "true"}
      - {path: "{.spec.containers[0].securityContext.capabilities.drop}", op: contains, value: ALL}
      - {path: "{.spec.containers[0].securityContext.capabilities.add}", op: eq, value: "[NET_BIND_SERVICE]"}
  - type: command
    description: Inside the Pod, id shows uid=1000 gid=3000 and / is read-only
    run: |
      kubectl -n lab-secctx exec secure -- sh -c 'echo "$(id -u) $(id -g) $(touch /x 2>/dev/null && echo rw || echo ro)"'
    stdout: {op: eq, value: "1000 3000 ro"}
    retry: 90s
docs: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
solution: |
  # spec.securityContext: {runAsUser: 1000, runAsGroup: 3000, fsGroup: 2000, runAsNonRoot: true,
  #                        seccompProfile: {type: RuntimeDefault}}
  # containers[].securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true,
  #                                capabilities: {drop: [ALL], add: [NET_BIND_SERVICE]}}
solutionScript: |
  set -euo pipefail
  kubectl -n lab-secctx apply -f - <<'EOF'
  apiVersion: v1
  kind: Pod
  metadata:
    name: secure
  spec:
    securityContext:
      runAsUser: 1000
      runAsGroup: 3000
      fsGroup: 2000
      runAsNonRoot: true
      seccompProfile: {type: RuntimeDefault}
    containers:
      - name: busybox
        image: busybox:1.36
        command: ["sleep", "3600"]
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
            add: [NET_BIND_SERVICE]
  EOF
  kubectl -n lab-secctx wait --for=condition=Ready pod/secure --timeout=120s
