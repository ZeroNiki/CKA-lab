id: storage-01-pv-pvc
title: Static PV and a matching claim
difficulty: medium
ns: lab-pv
statement: |
  1. Create a PersistentVolume `pv-logs`: capacity `1Gi`, access mode `ReadWriteOnce`,
     storage class `manual`, hostPath `/mnt/lab/logs`.
  2. In namespace `lab-pv` create a PVC `logs` requesting `500Mi` from class `manual`, `ReadWriteOnce`.
  3. Create a Pod `reader` (image `busybox:1.36`, command `sleep 3600`) mounting the claim at `/logs`.

  The claim must be bound to `pv-logs` and the Pod Running.
setup:
  commands:
    - run: kubectl delete pv pv-logs --ignore-not-found --wait=true --timeout=60s
checks:
  - type: resource
    description: PV pv-logs is 1Gi RWO, class manual, hostPath /mnt/lab/logs
    target: {apiVersion: v1, kind: PersistentVolume, name: pv-logs}
    assert:
      - {path: "{.spec.capacity.storage}", op: eq, value: 1Gi}
      - {path: "{.spec.accessModes}", op: contains, value: ReadWriteOnce}
      - {path: "{.spec.storageClassName}", op: eq, value: manual}
      - {path: "{.spec.hostPath.path}", op: eq, value: /mnt/lab/logs}
  - type: resource
    description: PVC logs is Bound to pv-logs
    target: {apiVersion: v1, kind: PersistentVolumeClaim, name: logs}
    retry: 60s
    assert:
      - {path: "{.status.phase}", op: eq, value: Bound}
      - {path: "{.spec.volumeName}", op: eq, value: pv-logs}
  - type: resource
    description: Pod reader mounts the claim at /logs and is Running
    target: {apiVersion: v1, kind: Pod, name: reader}
    retry: 120s
    assert:
      - {path: "{.spec.volumes[*].persistentVolumeClaim.claimName}", op: eq, value: logs}
      - {path: '{.spec.containers[0].volumeMounts[?(@.mountPath=="/logs")].name}', op: exists}
      - {path: "{.status.phase}", op: eq, value: Running}
docs: https://kubernetes.io/docs/tasks/configure-pod-container/configure-persistent-volume-storage/
solution: |
  # PV: spec {capacity: {storage: 1Gi}, accessModes: [ReadWriteOnce], storageClassName: manual,
  #           hostPath: {path: /mnt/lab/logs}}
  # PVC: spec {storageClassName: manual, accessModes: [ReadWriteOnce], resources: {requests: {storage: 500Mi}}}
  # Pod: volumes: [{name: logs, persistentVolumeClaim: {claimName: logs}}]
solutionScript: |
  set -euo pipefail
  kubectl apply -f - <<'EOF'
  apiVersion: v1
  kind: PersistentVolume
  metadata:
    name: pv-logs
  spec:
    capacity: {storage: 1Gi}
    accessModes: [ReadWriteOnce]
    storageClassName: manual
    hostPath: {path: /mnt/lab/logs}
  EOF
  kubectl -n lab-pv apply -f - <<'EOF'
  apiVersion: v1
  kind: PersistentVolumeClaim
  metadata:
    name: logs
  spec:
    storageClassName: manual
    accessModes: [ReadWriteOnce]
    resources:
      requests: {storage: 500Mi}
  ---
  apiVersion: v1
  kind: Pod
  metadata:
    name: reader
  spec:
    containers:
      - name: busybox
        image: busybox:1.36
        command: ["sleep", "3600"]
        volumeMounts: [{name: logs, mountPath: /logs}]
    volumes:
      - name: logs
        persistentVolumeClaim: {claimName: logs}
  EOF
  kubectl -n lab-pv wait --for=condition=Ready pod/reader --timeout=120s
