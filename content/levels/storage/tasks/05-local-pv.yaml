id: storage-05-local-pv
title: Local PersistentVolume pinned to a node
difficulty: hard
ns: lab-local
statement: |
  The directory `/mnt/lab/local` exists on `node02`.

  1. Create a StorageClass `local-storage` with no dynamic provisioner
     (`kubernetes.io/no-provisioner`) and binding delayed until a Pod uses the claim.
  2. Create a **local** PersistentVolume `local-pv` (`2Gi`, `ReadWriteOnce`, class `local-storage`,
     path `/mnt/lab/local`) usable only on `node02`.
  3. In namespace `lab-local` create a PVC `local-claim` (`1Gi`) and a Pod `app`
     (image `busybox:1.36`, command `sleep 3600`) that mounts it at `/data`.

  The Pod must be Running on `node02`.
setup:
  commands:
    - run: |
        kubectl delete pv local-pv --ignore-not-found --wait=true --timeout=60s
        kubectl delete storageclass local-storage --ignore-not-found
    - node: node02
      run: sudo mkdir -p /mnt/lab/local
checks:
  - type: resource
    description: StorageClass local-storage has no provisioner and WaitForFirstConsumer
    target: {apiVersion: storage.k8s.io/v1, kind: StorageClass, name: local-storage}
    assert:
      - {path: "{.provisioner}", op: eq, value: kubernetes.io/no-provisioner}
      - {path: "{.volumeBindingMode}", op: eq, value: WaitForFirstConsumer}
  - type: resource
    description: PV local-pv is a local volume at /mnt/lab/local limited to node02
    target: {apiVersion: v1, kind: PersistentVolume, name: local-pv}
    assert:
      - {path: "{.spec.local.path}", op: eq, value: /mnt/lab/local}
      - {path: "{.spec.storageClassName}", op: eq, value: local-storage}
      - {path: "{.spec.nodeAffinity.required.nodeSelectorTerms[*].matchExpressions[*].values}", op: contains, value: node02}
  - type: resource
    description: Pod app runs on node02
    target: {apiVersion: v1, kind: Pod, name: app}
    retry: 120s
    assert:
      - {path: "{.spec.nodeName}", op: eq, value: node02}
      - {path: "{.status.phase}", op: eq, value: Running}
  - type: resource
    description: PVC local-claim is Bound to local-pv
    target: {apiVersion: v1, kind: PersistentVolumeClaim, name: local-claim}
    assert:
      - {path: "{.spec.volumeName}", op: eq, value: local-pv}
docs: https://kubernetes.io/docs/concepts/storage/volumes/#local
solution: |
  # PV: spec.local.path: /mnt/lab/local
  #     spec.nodeAffinity.required.nodeSelectorTerms:
  #       - matchExpressions: [{key: kubernetes.io/hostname, operator: In, values: [node02]}]
  # The scheduler places the Pod on node02 because of the PV's nodeAffinity.
solutionScript: |
  set -euo pipefail
  kubectl apply -f - <<'EOF'
  apiVersion: storage.k8s.io/v1
  kind: StorageClass
  metadata:
    name: local-storage
  provisioner: kubernetes.io/no-provisioner
  volumeBindingMode: WaitForFirstConsumer
  ---
  apiVersion: v1
  kind: PersistentVolume
  metadata:
    name: local-pv
  spec:
    capacity: {storage: 2Gi}
    accessModes: [ReadWriteOnce]
    storageClassName: local-storage
    local: {path: /mnt/lab/local}
    nodeAffinity:
      required:
        nodeSelectorTerms:
          - matchExpressions:
              - {key: kubernetes.io/hostname, operator: In, values: [node02]}
  EOF
  kubectl -n lab-local apply -f - <<'EOF'
  apiVersion: v1
  kind: PersistentVolumeClaim
  metadata:
    name: local-claim
  spec:
    storageClassName: local-storage
    accessModes: [ReadWriteOnce]
    resources:
      requests: {storage: 1Gi}
  ---
  apiVersion: v1
  kind: Pod
  metadata:
    name: app
  spec:
    containers:
      - name: busybox
        image: busybox:1.36
        command: ["sleep", "3600"]
        volumeMounts: [{name: data, mountPath: /data}]
    volumes:
      - name: data
        persistentVolumeClaim: {claimName: local-claim}
  EOF
  kubectl -n lab-local wait --for=condition=Ready pod/app --timeout=120s
