id: storage-06-sidecar
title: Native sidecar sharing an emptyDir
difficulty: hard
ns: lab-sidecar
statement: |
  In namespace `lab-sidecar` create a Pod `logger` with:

  - a volume `logs` of type `emptyDir` limited to `50Mi`;
  - main container `app` (image `busybox:1.36`) that appends the line `tick` to
    `/var/log/app/app.log` every second;
  - a **native sidecar** container `tailer` (image `busybox:1.36`) that runs
    `tail -F /var/log/app/app.log`, starts before `app` and keeps running alongside it.

  Both containers mount `logs` at `/var/log/app`.
  `kubectl logs logger -c tailer` must show `tick` lines.
checks:
  - type: resource
    description: tailer is an init container with restartPolicy Always
    target: {apiVersion: v1, kind: Pod, name: logger}
    assert:
      - {path: '{.spec.initContainers[?(@.name=="tailer")].restartPolicy}', op: eq, value: Always}
      - {path: '{.spec.containers[?(@.name=="app")].image}', op: eq, value: "busybox:1.36"}
  - type: resource
    description: Volume logs is an emptyDir with sizeLimit 50Mi
    target: {apiVersion: v1, kind: Pod, name: logger}
    assert:
      - {path: '{.spec.volumes[?(@.name=="logs")].emptyDir.sizeLimit}', op: eq, value: 50Mi}
  - type: command
    description: The tailer sidecar prints tick lines
    run: kubectl -n lab-sidecar logs logger -c tailer --tail=20 | grep -c '^tick$'
    stdout: {op: gte, value: "1"}
    retry: 90s
docs: https://kubernetes.io/docs/concepts/workloads/pods/sidecar-containers/
solution: |
  # spec:
  #   initContainers:
  #     - {name: tailer, image: busybox:1.36, restartPolicy: Always,
  #        command: [sh, -c, "touch /var/log/app/app.log; tail -F /var/log/app/app.log"], volumeMounts: [...]}
  #   containers:
  #     - {name: app, image: busybox:1.36, command: [sh, -c, "while true; do echo tick >> /var/log/app/app.log; sleep 1; done"]}
  #   volumes: [{name: logs, emptyDir: {sizeLimit: 50Mi}}]
solutionScript: |
  set -euo pipefail
  kubectl -n lab-sidecar apply -f - <<'EOF'
  apiVersion: v1
  kind: Pod
  metadata:
    name: logger
  spec:
    initContainers:
      - name: tailer
        image: busybox:1.36
        restartPolicy: Always
        command: ["sh", "-c", "touch /var/log/app/app.log; tail -F /var/log/app/app.log"]
        volumeMounts: [{name: logs, mountPath: /var/log/app}]
    containers:
      - name: app
        image: busybox:1.36
        command: ["sh", "-c", "while true; do echo tick >> /var/log/app/app.log; sleep 1; done"]
        volumeMounts: [{name: logs, mountPath: /var/log/app}]
    volumes:
      - name: logs
        emptyDir: {sizeLimit: 50Mi}
  EOF
  kubectl -n lab-sidecar wait --for=condition=Ready pod/logger --timeout=120s
