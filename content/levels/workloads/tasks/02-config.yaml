id: workloads-02-config
title: ConfigMap and Secret in one Pod
difficulty: medium
ns: lab-config
statement: |
  In namespace `lab-config`:

  1. Create a ConfigMap `app-config` with key `LOG_LEVEL=debug`.
  2. Create a Secret `app-secret` with key `DB_PASSWORD=s3cr3t`.
  3. Create a Pod `app` (image `busybox:1.36`, command `sleep 3600`) where
     - the environment variable `LOG_LEVEL` comes from the ConfigMap key,
     - all keys of `app-secret` are mounted as files, read-only, under `/etc/secret`.
checks:
  - type: resource
    description: ConfigMap app-config has LOG_LEVEL=debug
    target: {apiVersion: v1, kind: ConfigMap, name: app-config}
    assert:
      - {path: "{.data.LOG_LEVEL}", op: eq, value: debug}
  - type: resource
    description: Secret app-secret has DB_PASSWORD=s3cr3t
    target: {apiVersion: v1, kind: Secret, name: app-secret}
    assert:
      - {path: "{.data.DB_PASSWORD}", op: eq, value: czNjcjN0}
  - type: resource
    description: LOG_LEVEL is taken from ConfigMap app-config
    target: {apiVersion: v1, kind: Pod, name: app}
    assert:
      - {path: '{.spec.containers[0].env[?(@.name=="LOG_LEVEL")].valueFrom.configMapKeyRef.name}', op: eq, value: app-config}
      - {path: '{.spec.containers[0].env[?(@.name=="LOG_LEVEL")].valueFrom.configMapKeyRef.key}', op: eq, value: LOG_LEVEL}
  - type: resource
    description: /etc/secret is mounted read-only
    target: {apiVersion: v1, kind: Pod, name: app}
    assert:
      - {path: '{.spec.containers[0].volumeMounts[?(@.mountPath=="/etc/secret")].readOnly}', op: eq, value: "true"}
      - {path: "{.spec.volumes[*].secret.secretName}", op: eq, value: app-secret}
  - type: command
    description: The secret file contains s3cr3t and the env var is debug
    run: |
      kubectl -n lab-config exec app -- sh -c 'echo "$(cat /etc/secret/DB_PASSWORD) $LOG_LEVEL"'
    stdout: {op: eq, value: "s3cr3t debug"}
    retry: 90s
docs: https://kubernetes.io/docs/concepts/configuration/secret/#using-secrets-as-files-from-a-pod
solution: |
  kubectl -n lab-config create configmap app-config --from-literal=LOG_LEVEL=debug
  kubectl -n lab-config create secret generic app-secret --from-literal=DB_PASSWORD=s3cr3t
  # Pod spec:
  #   env:
  #     - name: LOG_LEVEL
  #       valueFrom: {configMapKeyRef: {name: app-config, key: LOG_LEVEL}}
  #   volumeMounts: [{name: secret, mountPath: /etc/secret, readOnly: true}]
  # volumes: [{name: secret, secret: {secretName: app-secret}}]
solutionScript: |
  set -euo pipefail
  kubectl -n lab-config create configmap app-config --from-literal=LOG_LEVEL=debug
  kubectl -n lab-config create secret generic app-secret --from-literal=DB_PASSWORD=s3cr3t
  kubectl -n lab-config apply -f - <<'EOF'
  apiVersion: v1
  kind: Pod
  metadata:
    name: app
  spec:
    containers:
      - name: app
        image: busybox:1.36
        command: ["sleep", "3600"]
        env:
          - name: LOG_LEVEL
            valueFrom:
              configMapKeyRef: {name: app-config, key: LOG_LEVEL}
        volumeMounts:
          - {name: secret, mountPath: /etc/secret, readOnly: true}
    volumes:
      - name: secret
        secret: {secretName: app-secret}
  EOF
  kubectl -n lab-config wait --for=condition=Ready pod/app --timeout=120s
