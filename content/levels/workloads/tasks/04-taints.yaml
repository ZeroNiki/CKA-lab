id: workloads-04-taints
title: Dedicated node with taints
difficulty: hard
ns: lab-taints
statement: |
  Dedicate `node01` to GPU workloads:

  1. Taint `node01` with key `dedicated`, value `gpu`, effect `NoSchedule`.
  2. Label `node01` with `accelerator=gpu`.
  3. In namespace `lab-taints` create a Deployment `trainer` (image `busybox:1.36`,
     command `sleep 3600`, 2 replicas, Pod label `app=trainer`) whose Pods
     run **only** on `node01`.

  Other Pods without a toleration must no longer be scheduled on `node01`.
setup:
  commands:
    # Start from a node without the taint and label, so the task never solves itself.
    - run: |
        kubectl taint nodes node01 dedicated- 2>/dev/null || true
        kubectl label nodes node01 accelerator- 2>/dev/null || true
checks:
  - type: resource
    description: node01 has taint dedicated=gpu:NoSchedule
    target: {apiVersion: v1, kind: Node, name: node01}
    assert:
      - {path: '{.spec.taints[?(@.key=="dedicated")].value}', op: eq, value: gpu}
      - {path: '{.spec.taints[?(@.key=="dedicated")].effect}', op: eq, value: NoSchedule}
  - type: resource
    description: node01 is labeled accelerator=gpu
    target: {apiVersion: v1, kind: Node, name: node01}
    assert:
      - {path: "{.metadata.labels.accelerator}", op: eq, value: gpu}
  - type: podsReady
    description: 2 trainer Pods are Ready
    selector: app=trainer
    min: 2
    retry: 120s
  - type: resource
    description: All trainer Pods run on node01
    target: {apiVersion: v1, kind: Pod, labelSelector: app=trainer}
    assert:
      - {path: "{.spec.nodeName}", op: eq, value: node01}
docs: https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
solution: |
  kubectl taint nodes node01 dedicated=gpu:NoSchedule
  kubectl label nodes node01 accelerator=gpu
  # Pod template:
  #   nodeSelector: {accelerator: gpu}
  #   tolerations: [{key: dedicated, operator: Equal, value: gpu, effect: NoSchedule}]
  # A toleration alone does not pin Pods to the node; the nodeSelector does.
solutionScript: |
  set -euo pipefail
  kubectl taint nodes node01 dedicated=gpu:NoSchedule --overwrite
  kubectl label nodes node01 accelerator=gpu --overwrite
  kubectl -n lab-taints apply -f - <<'EOF'
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: trainer
  spec:
    replicas: 2
    selector:
      matchLabels: {app: trainer}
    template:
      metadata:
        labels: {app: trainer}
      spec:
        nodeSelector: {accelerator: gpu}
        tolerations:
          - {key: dedicated, operator: Equal, value: gpu, effect: NoSchedule}
        containers:
          - name: busybox
            image: busybox:1.36
            command: ["sleep", "3600"]
  EOF
  kubectl -n lab-taints rollout status deployment trainer --timeout=180s
