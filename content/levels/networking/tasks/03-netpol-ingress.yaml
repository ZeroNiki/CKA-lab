id: networking-03-netpol-ingress
title: Default deny, then allow the frontend
difficulty: hard
ns: lab-netpol
statement: |
  In namespace `lab-netpol` there are Deployments `api` and `frontend`, a Pod `other`
  and a Service `api` (port 80).

  1. Create NetworkPolicy `default-deny` that denies **all ingress** to **all Pods** in the namespace.
  2. Create NetworkPolicy `allow-frontend` that allows ingress to Pods `app=api` only from
     Pods `app=frontend`, only on TCP port 80.

  Result: `frontend` can reach `http://api`, `other` cannot.
setup:
  manifests:
    - |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: api
      spec:
        selector:
          matchLabels: {app: api}
        template:
          metadata:
            labels: {app: api}
          spec:
            containers:
              - {name: nginx, image: "nginx:1.27-alpine"}
      ---
      apiVersion: v1
      kind: Service
      metadata:
        name: api
      spec:
        selector: {app: api}
        ports: [{port: 80}]
      ---
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: frontend
      spec:
        selector:
          matchLabels: {app: frontend}
        template:
          metadata:
            labels: {app: frontend}
          spec:
            containers:
              - {name: busybox, image: "busybox:1.36", command: ["sleep", "3600"]}
      ---
      apiVersion: v1
      kind: Pod
      metadata:
        name: other
        labels: {app: other}
      spec:
        containers:
          - {name: busybox, image: "busybox:1.36", command: ["sleep", "3600"]}
checks:
  - type: resource
    description: default-deny selects all Pods and isolates Ingress
    target: {apiVersion: networking.k8s.io/v1, kind: NetworkPolicy, name: default-deny}
    assert:
      - {path: "{.spec.podSelector}", op: eq, value: "map[]"}
      - {path: "{.spec.policyTypes}", op: contains, value: Ingress}
      - {path: "{.spec.ingress}", op: notExists}
  - type: resource
    description: allow-frontend selects app=api, allows app=frontend on TCP 80
    target: {apiVersion: networking.k8s.io/v1, kind: NetworkPolicy, name: allow-frontend}
    assert:
      - {path: "{.spec.podSelector.matchLabels.app}", op: eq, value: api}
      - {path: "{.spec.ingress[*].from[*].podSelector.matchLabels.app}", op: eq, value: frontend}
      - {path: "{.spec.ingress[*].ports[*].port}", op: eq, value: "80"}
  - type: command
    description: frontend reaches http://api
    run: kubectl -n lab-netpol exec deploy/frontend -- wget -qO- -T 3 http://api >/dev/null 2>&1 && echo open || echo blocked
    stdout: {op: eq, value: open}
    retry: 90s
  - type: command
    description: other cannot reach http://api
    run: kubectl -n lab-netpol exec other -- wget -qO- -T 3 http://api >/dev/null 2>&1 && echo open || echo blocked
    stdout: {op: eq, value: blocked}
    retry: 30s
docs: https://kubernetes.io/docs/concepts/services-networking/network-policies/#default-deny-all-ingress-traffic
solution: |
  # default-deny: spec: {podSelector: {}, policyTypes: [Ingress]}
  # allow-frontend: podSelector {matchLabels: {app: api}},
  #   ingress: [{from: [{podSelector: {matchLabels: {app: frontend}}}], ports: [{protocol: TCP, port: 80}]}]
solutionScript: |
  set -euo pipefail
  kubectl -n lab-netpol apply -f - <<'EOF'
  apiVersion: networking.k8s.io/v1
  kind: NetworkPolicy
  metadata:
    name: default-deny
  spec:
    podSelector: {}
    policyTypes: [Ingress]
  ---
  apiVersion: networking.k8s.io/v1
  kind: NetworkPolicy
  metadata:
    name: allow-frontend
  spec:
    podSelector:
      matchLabels: {app: api}
    policyTypes: [Ingress]
    ingress:
      - from:
          - podSelector:
              matchLabels: {app: frontend}
        ports:
          - {protocol: TCP, port: 80}
  EOF
  kubectl -n lab-netpol rollout status deployment api --timeout=120s
  kubectl -n lab-netpol rollout status deployment frontend --timeout=120s
