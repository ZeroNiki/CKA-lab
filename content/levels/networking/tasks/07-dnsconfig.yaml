id: networking-07-dnsconfig
title: Custom Pod DNS configuration
difficulty: hard
ns: lab-dnsconf
statement: |
  In namespace `lab-dnsconf` create a Pod `resolver` (image `busybox:1.36`, command `sleep 3600`)
  that does **not** inherit the default DNS settings. Instead its `/etc/resolv.conf` must contain:

  - nameserver: the ClusterIP of the cluster DNS Service (find it yourself),
  - search domains, in this order: `lab-dnsconf.svc.cluster.local`, `svc.cluster.local`,
  - option `ndots:2`.

  Additionally, save the ClusterIP of the cluster DNS Service into the file
  `/home/vagrant/dns-ip.txt` on the control plane (only the IP).
checks:
  - type: resource
    description: Pod resolver uses dnsPolicy None with ndots 2
    target: {apiVersion: v1, kind: Pod, name: resolver}
    assert:
      - {path: "{.spec.dnsPolicy}", op: eq, value: None}
      - {path: '{.spec.dnsConfig.options[?(@.name=="ndots")].value}', op: eq, value: "2"}
      - {path: "{.spec.dnsConfig.searches[0]}", op: eq, value: lab-dnsconf.svc.cluster.local}
      - {path: "{.spec.dnsConfig.searches[1]}", op: eq, value: svc.cluster.local}
  - type: command
    description: Nameserver in resolv.conf is the kube-dns ClusterIP
    run: |
      want=$(kubectl -n kube-system get service kube-dns -o jsonpath='{.spec.clusterIP}')
      got=$(kubectl -n lab-dnsconf exec resolver -- awk '/^nameserver/ {print $2}' /etc/resolv.conf)
      [ "$want" = "$got" ] && echo ok || echo "nameserver $got, want $want"
    stdout: {op: eq, value: ok}
    retry: 60s
  - type: command
    description: kubernetes.default.svc.cluster.local resolves from the Pod
    # busybox >= 1.28 nslookup ignores the search list, so query the full name.
    run: kubectl -n lab-dnsconf exec resolver -- nslookup kubernetes.default.svc.cluster.local >/dev/null 2>&1
    retry: 30s
  - type: command
    description: /home/vagrant/dns-ip.txt contains the kube-dns ClusterIP
    run: |
      [ "$(tr -d '[:space:]' </home/vagrant/dns-ip.txt)" = "$(kubectl -n kube-system get service kube-dns -o jsonpath='{.spec.clusterIP}')" ] && echo ok
    stdout: {op: eq, value: ok}
setup:
  commands:
    - run: rm -f /home/vagrant/dns-ip.txt
docs: https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/#pod-dns-config
solution: |
  kubectl -n kube-system get service kube-dns -o jsonpath='{.spec.clusterIP}' > /home/vagrant/dns-ip.txt
  # Pod spec:
  #   dnsPolicy: "None"
  #   dnsConfig:
  #     nameservers: [10.96.0.10]
  #     searches: [lab-dnsconf.svc.cluster.local, svc.cluster.local]
  #     options: [{name: ndots, value: "2"}]
solutionScript: |
  set -euo pipefail
  ip=$(kubectl -n kube-system get service kube-dns -o jsonpath='{.spec.clusterIP}')
  echo "$ip" >/home/vagrant/dns-ip.txt
  kubectl -n lab-dnsconf apply -f - <<EOF
  apiVersion: v1
  kind: Pod
  metadata:
    name: resolver
  spec:
    dnsPolicy: "None"
    dnsConfig:
      nameservers: ["$ip"]
      searches: [lab-dnsconf.svc.cluster.local, svc.cluster.local]
      options:
        - {name: ndots, value: "2"}
    containers:
      - name: busybox
        image: busybox:1.36
        command: ["sleep", "3600"]
  EOF
  kubectl -n lab-dnsconf wait --for=condition=Ready pod/resolver --timeout=120s
