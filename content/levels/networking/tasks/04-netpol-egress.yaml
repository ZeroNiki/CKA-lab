id: networking-04-netpol-egress
title: Egress only to the API and DNS
difficulty: hard
ns: lab-egress
statement: |
  In namespace `lab-egress` Pods `app=client` currently can connect anywhere.

  Create NetworkPolicy `client-egress` so that Pods `app=client` may open connections **only** to:
  - Pods `app=api` in the same namespace on TCP 80,
  - the cluster DNS (Pods `k8s-app=kube-dns` in namespace `kube-system`) on port 53, UDP and TCP.

  Result: from the client, `api:80` is reachable **by name**, while
  `kubernetes.default.svc:443` is not.
setup:
  manifests:
    - |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: api
      spec:
        selector:
          matchLabels: {app: api}
        template:
          metadata:
            labels: {app: api}
          spec:
            containers:
              - {name: nginx, image: "nginx:1.27-alpine"}
      ---
      apiVersion: v1
      kind: Service
      metadata:
        name: api
      spec:
        selector: {app: api}
        ports: [{port: 80}]
      ---
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: client
      spec:
        selector:
          matchLabels: {app: client}
        template:
          metadata:
            labels: {app: client}
          spec:
            containers:
              - {name: busybox, image: "busybox:1.36", command: ["sleep", "3600"]}
checks:
  - type: resource
    description: client-egress selects app=client and isolates Egress
    target: {apiVersion: networking.k8s.io/v1, kind: NetworkPolicy, name: client-egress}
    assert:
      - {path: "{.spec.podSelector.matchLabels.app}", op: eq, value: client}
      - {path: "{.spec.policyTypes}", op: contains, value: Egress}
  - type: command
    description: client reaches api:80 by name
    run: kubectl -n lab-egress exec deploy/client -- nc -z -w 3 api 80 && echo open || echo blocked
    stdout: {op: eq, value: open}
    retry: 90s
  - type: command
    description: client cannot reach kubernetes.default.svc:443
    run: kubectl -n lab-egress exec deploy/client -- nc -z -w 3 kubernetes.default.svc 443 && echo open || echo blocked
    stdout: {op: eq, value: blocked}
    retry: 30s
docs: https://kubernetes.io/docs/concepts/services-networking/network-policies/#behavior-of-to-and-from-selectors
solution: |
  # egress:
  #   - to: [{podSelector: {matchLabels: {app: api}}}]
  #     ports: [{protocol: TCP, port: 80}]
  #   - to:
  #       - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
  #         podSelector: {matchLabels: {k8s-app: kube-dns}}     # same item = AND
  #     ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
solutionScript: |
  set -euo pipefail
  kubectl -n lab-egress apply -f - <<'EOF'
  apiVersion: networking.k8s.io/v1
  kind: NetworkPolicy
  metadata:
    name: client-egress
  spec:
    podSelector:
      matchLabels: {app: client}
    policyTypes: [Egress]
    egress:
      - to:
          - podSelector:
              matchLabels: {app: api}
        ports:
          - {protocol: TCP, port: 80}
      - to:
          - namespaceSelector:
              matchLabels: {kubernetes.io/metadata.name: kube-system}
            podSelector:
              matchLabels: {k8s-app: kube-dns}
        ports:
          - {protocol: UDP, port: 53}
          - {protocol: TCP, port: 53}
  EOF
  kubectl -n lab-egress rollout status deployment api --timeout=120s
  kubectl -n lab-egress rollout status deployment client --timeout=120s
