id: trouble-03-pending
title: Pods stuck in Pending
difficulty: hard
ns: lab-pending
statement: |
  In namespace `lab-pending` the Pods of Deployment `worker` stay `Pending`.

  Make both replicas Running **on `node02`**. Constraints:
  - keep the Deployment's `nodeSelector` exactly as it is,
  - keep a CPU **request** set on the container (any value that fits the node).
setup:
  commands:
    - run: kubectl label nodes --all disktype- 2>/dev/null || true
  manifests:
    - |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: worker
      spec:
        replicas: 2
        selector:
          matchLabels: {app: worker}
        template:
          metadata:
            labels: {app: worker}
          spec:
            nodeSelector: {disktype: ssd}
            containers:
              - name: busybox
                image: busybox:1.36
                command: ["sleep", "3600"]
                resources:
                  requests: {cpu: "3"}
checks:
  - type: resource
    description: nodeSelector disktype=ssd is unchanged and a CPU request is set
    target: {apiVersion: apps/v1, kind: Deployment, name: worker}
    assert:
      - {path: "{.spec.template.spec.nodeSelector.disktype}", op: eq, value: ssd}
      - {path: "{.spec.template.spec.containers[0].resources.requests.cpu}", op: exists}
  - type: podsReady
    description: 2 worker Pods are Ready
    selector: app=worker
    min: 2
    retry: 120s
  - type: resource
    description: All worker Pods run on node02
    target: {apiVersion: v1, kind: Pod, labelSelector: app=worker}
    assert:
      - {path: "{.spec.nodeName}", op: eq, value: node02}
docs: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#nodeselector
solution: |
  kubectl -n lab-pending describe pod -l app=worker   # untolerated/mismatch: node selector; Insufficient cpu
  kubectl label nodes node02 disktype=ssd
  kubectl -n lab-pending set resources deployment worker --requests=cpu=100m
solutionScript: |
  set -euo pipefail
  kubectl label nodes node02 disktype=ssd --overwrite
  kubectl -n lab-pending set resources deployment worker --requests=cpu=100m
  kubectl -n lab-pending rollout status deployment worker --timeout=180s
